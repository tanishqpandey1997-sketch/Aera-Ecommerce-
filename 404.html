<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Page Not Found | AERA</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .brand {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.28em;
            margin-bottom: 40px;
            text-transform: uppercase;
            color: #ffffff;
            text-decoration: none;
        }
        .error-code {
            font-size: 80px;
            font-weight: 300;
            letter-spacing: 0.1em;
            color: #d4af37;
            margin-bottom: 12px;
            line-height: 1;
        }
        h1 {
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 16px;
            color: #e5e5e5;
        }
        p {
            font-size: 14px;
            color: #999999;
            max-width: 440px;
            line-height: 1.6;
            margin-bottom: 36px;
            letter-spacing: 0.05em;
        }
        .actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #ffffff;
            color: #0b0b0b;
            border: 1px solid #ffffff;
        }
        .btn-primary:hover {
            background-color: #d4af37;
            border-color: #d4af37;
            color: #000000;
        }
        .btn-outline {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #444444;
        }
        .btn-outline:hover {
            border-color: #ffffff;
        }
    </style>
</head>
<body>
    <a href="/" class="brand">AERA</a>
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The piece or page you are looking for might have been moved, renamed, or is temporarily unavailable.</p>
    <div class="actions">
        <a href="/" class="btn btn-primary">Return to Homepage</a>
        <a href="/collections/shop-all" class="btn btn-outline">Explore Jewellery</a>
    </div>
</body>
</html>
